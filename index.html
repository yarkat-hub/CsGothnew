<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>CsGoth</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070b;--y:#ffc400;--y2:#ffe066;--o:#ff8a00;--tx:#f6f1de;--mut:#9a96a8;--line:rgba(255,196,0,.22);--card:rgba(255,255,255,.045);--r0:#9aa4b2;--r1:#4b9bff;--r2:#a65cff;--r3:#ff4fa3;--r4:#ffc400;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:70px}
body{margin:0;min-height:100vh;color:var(--tx);font-family:'Chakra Petch',system-ui,sans-serif;font-weight:500;line-height:1.45;background:var(--bg);overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(900px 500px at 85% -5%,#3d2e00 0,transparent 60%),radial-gradient(700px 500px at -10% 40%,#2a0d3d 0,transparent 55%),radial-gradient(800px 500px at 60% 110%,#3d1c00 0,transparent 55%),#07070b}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.33;animation:fl 14s ease-in-out infinite alternate}
.bg i:nth-child(1){width:260px;height:260px;background:#ffb300;left:-60px;top:18%}
.bg i:nth-child(2){width:300px;height:300px;background:#7a2cff;right:-90px;top:46%;animation-delay:-5s}
.bg i:nth-child(3){width:220px;height:220px;background:#ff5a00;left:30%;bottom:-70px;animation-delay:-9s}
@keyframes fl{to{transform:translate(40px,-60px) scale(1.2)}}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:linear-gradient(180deg,rgba(7,7,11,.97),rgba(7,7,11,.85));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{font-weight:700;font-size:26px;letter-spacing:1px}
.logo b,.hl{background:linear-gradient(90deg,var(--y2),var(--o));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(255,170,0,.55))}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gold{display:inline-flex;align-items:center;gap:6px;background:rgba(255,196,0,.08);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:700;color:var(--y2)}
.coin{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffb300);color:#4a3300;font-size:12px;font-weight:700;box-shadow:0 0 10px rgba(255,190,0,.6)}
button{font:inherit;font-weight:700;cursor:pointer;border:0;padding:10px 18px;border-radius:12px;color:#1a1200;background:linear-gradient(180deg,#ffd84a,#ffb300);box-shadow:0 6px 18px rgba(255,170,0,.28),inset 0 1px 0 rgba(255,255,255,.55);position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s}
button::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.8s infinite}
@keyframes shine{0%,60%{left:-70%}100%{left:130%}}
button:active{transform:scale(.97)}
button.ghost{background:rgba(255,196,0,.07);color:var(--y);border:1px solid var(--line);box-shadow:none}
button.ghost::after,button.it::after,.nav button::after,.seg button::after{display:none}
button:disabled{opacity:.4;cursor:default}button:disabled::after{display:none}
button.sm{padding:8px 12px;font-size:14px}
button.big{width:100%;padding:14px;font-size:17px;margin:8px 0}
button.sq{padding:0;width:48px;height:48px;display:grid;place-items:center;flex:none}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
main{max-width:980px;margin:0 auto;padding:14px 14px 120px}
section[hidden]{display:none}
h1{font-size:clamp(30px,8vw,50px);line-height:1.05;margin:14px 0 6px}
h2{font-size:22px;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2::before{content:"";width:5px;height:22px;border-radius:3px;background:linear-gradient(var(--y2),var(--o))}
h3{margin:14px 0 8px;font-size:17px}
.sub{color:var(--mut);margin:0 0 10px;max-width:62ch}
.note{color:var(--mut);font-size:13px}
.lnk{color:var(--y)}
a{color:var(--y)}
label{color:var(--mut);font-size:14px;display:block;margin-top:6px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.pad{padding:16px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.case{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.case:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(255,170,0,.2)}
.case .cv{width:100%;display:block}
.case .in{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.case h3{margin:0;font-size:17px}
.case small{color:var(--mut)}
.case button .coin{background:#1a1200;color:var(--y);box-shadow:none}
.cv .wp{animation:bob 3.4s ease-in-out infinite alternate}
.cv .ring{transform-origin:110px 66px;animation:spin 20s linear infinite}
@keyframes bob{to{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.it{--c:var(--r0);position:relative;flex:0 0 118px;height:128px;padding:8px;border-radius:12px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;line-height:1.25;text-align:left;color:var(--tx);background:#14141c;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,#14141c),#0c0c12);border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-bottom:4px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 18%,transparent)}
.it b{display:block;color:var(--c);font-size:12px}
.it.r3,.it.r4{animation:glow 2.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 24px var(--c)}}
button.it{padding:8px;background:#14141c;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 20%,#14141c),#0c0c12);color:var(--tx);border-radius:12px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-bottom:4px solid var(--c)}
.it.pick{outline:3px solid var(--y);outline-offset:1px;transform:translateY(-2px)}
.wi{width:100%;height:46px;fill:var(--c);color:var(--c);stroke-width:3;filter:drop-shadow(0 0 8px var(--c))}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.inv .it{flex:none;width:auto}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.seg{display:flex;background:rgba(255,255,255,.06);border-radius:14px;padding:4px;gap:4px;margin:8px 0}
.seg button{flex:1;background:transparent;color:var(--mut);box-shadow:none;padding:10px}
.seg button.on{background:linear-gradient(180deg,#ffd84a,#ffb300);color:#1a1200}
input{font:inherit;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;margin:4px 0 10px;outline:0}
input:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,196,0,.18)}
input.bad{border-color:#ff4d5e}
.fld{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:12px;padding:12px;font-weight:700;font-size:18px;color:var(--y2);margin:4px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.err{color:#ff5d6c;min-height:20px;margin:4px 0;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;place-items:center;grid-template-columns:minmax(0,1fr);z-index:10;padding:14px;overflow:auto}
.modal.on{display:grid}
.box{min-width:0;max-width:100%;justify-self:center;background:linear-gradient(160deg,#181821,#0e0e14);border:1px solid var(--line);border-radius:20px;padding:18px;width:min(720px,100%);position:relative;box-shadow:0 24px 70px rgba(0,0,0,.7);animation:up .25s ease}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.x{position:absolute;right:8px;top:8px;padding:4px 12px;background:transparent;color:var(--y);font-size:22px;box-shadow:none}
.x::after{display:none}
.reel{position:relative;overflow:hidden;margin:14px -4px;border-radius:14px;background:linear-gradient(180deg,#0a0a10,#16161f);border:1px solid var(--line);-webkit-mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent);mask-image:linear-gradient(90deg,transparent,#000 9%,#000 91%,transparent)}
.strip{display:flex;gap:8px;padding:12px 0;will-change:transform}
.strip .it{flex:0 0 116px;height:124px}
.strip .it.win{transform:scale(1.08);box-shadow:0 0 30px var(--c);z-index:1;transition:transform .4s,box-shadow .4s}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:linear-gradient(180deg,var(--y2),var(--o));box-shadow:0 0 18px var(--y);z-index:2}
.ptr::before,.ptr::after{content:"";position:absolute;left:50%;transform:translateX(-50%);border:8px solid transparent}
.ptr::before{top:0;border-top-color:var(--y)}.ptr::after{bottom:0;border-bottom-color:var(--y)}
.qm{position:absolute;inset:0;display:grid;place-items:center;z-index:3;background:radial-gradient(circle,rgba(0,0,0,.15),rgba(0,0,0,.8));transition:opacity .5s}
.qm.go{opacity:0;pointer-events:none}
.qm svg{animation:pulse 1.1s ease-in-out infinite;filter:drop-shadow(0 0 16px #ffb300)}
@keyframes pulse{50%{transform:scale(1.12)}}
.res{--c:var(--y);text-align:center;padding:14px;border-radius:16px;border:1px solid var(--c);background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%);animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.res .wi{height:70px}
.res .rn{color:var(--c);font-weight:700;letter-spacing:1px}
.res .rt{font-size:19px;margin:2px 0}
.res .rv{color:var(--y2);margin-bottom:10px;font-size:18px;font-weight:700}
.res .row{justify-content:center}
.gauge{width:min(270px,72vw);display:block;margin:6px auto;filter:drop-shadow(0 0 22px rgba(255,150,0,.3))}
.gp{font:700 32px 'Chakra Petch',sans-serif;fill:#ffd84a}
.gs{font:500 12px 'Chakra Petch',sans-serif;fill:#9a96a8}
.up-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sumcard{--c:var(--r0);padding:12px;text-align:center;min-height:128px;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:14px}
.sumcard b{color:var(--y2)}
.pop{animation:pop .35s}
.row2{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin:10px 0;cursor:pointer;font-weight:700;font-size:17px}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd84a,#ff9800);color:#1a1200;flex:none}
.prof{display:flex;align-items:center;gap:12px;padding:14px;margin:6px 0}
.prof .gold{margin-left:auto}
.av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:700;background:linear-gradient(135deg,#ffd84a,#ff7a00);color:#1a1200;box-shadow:0 0 18px rgba(255,150,0,.5)}
.pn{font-size:19px;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin:10px 0}
.stats div{padding:14px 6px;text-align:center;color:var(--mut);font-size:13px;border-right:1px solid var(--line)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:26px;color:var(--tx)}
.linkrow{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.linkrow input{margin:0;flex:1}
.empty{text-align:center;color:var(--mut);padding:14px;border:1px dashed var(--line);border-radius:14px}
.empty button{margin-top:10px}
.hist{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.st-new{color:var(--y)}.st-paid{color:#46e08a}.st-rejected{color:#ff5d6c}
.legal p{margin:0 0 10px;color:#d9d4c2;font-size:14px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl input{width:96px;margin:0;padding:8px}
.wrap{overflow-x:auto}
.nav{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:2px;background:rgba(14,14,20,.93);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:22px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.nav button{flex:1;background:transparent;color:var(--mut);box-shadow:none;padding:7px 2px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:16px}
.nav button.on{color:#1a1200;background:linear-gradient(180deg,#ffd84a,#ffb300);box-shadow:0 4px 14px rgba(255,170,0,.4)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(180deg,#ffd84a,#ffb300);color:#1a1200;padding:10px 18px;border-radius:12px;font-weight:700;z-index:20;display:none;max-width:90vw;text-align:center}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.strip{transition:none!important}}
</style>
</head>

<script>
const RC=['#9aa4b2','#4b9bff','#a65cff','#ff4fa3','#ffc400'];
const RN=['Ширпотреб','Армейское','Запрещённое','Засекреченное','Тайное'];
const TG=window.Telegram&&Telegram.WebApp;
let CASES=[],S=null,ADM=[],ADMP=[],ADMW=[],CFG={},TOKEN='',PM=null,lastWin=null,UPT=[];
const UP={sel:[],t:null,view:'mine',busy:false},WD={region:'ru',login:'',sel:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('ru-RU');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const hap=k=>{try{k==='ok'?TG.HapticFeedback.notificationOccurred('success'):TG.HapticFeedback.impactOccurred(k)}catch(e){}};

function cover(c){const t=THEME[c.id]||THEME.dust,id='g'+c.id;
 const deco=c.id==='dust'?'<path d="M0 112Q55 92 110 106T220 98V130H0z" fill="#ffb347" opacity=".28"/><circle cx="178" cy="26" r="14" fill="#ffd27a" opacity=".85"/>':c.id==='goth'?'<circle cx="170" cy="28" r="16" fill="#e9d8ff" opacity=".9"/><circle cx="178" cy="24" r="14" fill="#1a0b2e"/>':c.id==='gold'?[[30,26,3],[190,40,2.5],[48,100,2],[176,98,3.5],[110,16,2]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="#fff3a0"/>`).join(''):'<polygon points="110,6 115,19 129,19 118,27 122,41 110,32 98,41 102,27 91,19 105,19" fill="#9ff0c9" opacity=".9"/>';
 return `<svg class="cv" viewBox="0 0 220 130"><defs><radialGradient id="${id}" cx="50%" cy="85%" r="85%"><stop offset="0" stop-color="${t.a}" stop-opacity=".6"/><stop offset="1" stop-color="${t.b}" stop-opacity="0"/></radialGradient></defs><rect width="220" height="130" fill="${t.b}"/><rect width="220" height="130" fill="url(#${id})"/><circle class="ring" cx="110" cy="66" r="52" fill="none" stroke="${t.a}" stroke-opacity=".35" stroke-dasharray="6 8"/>${deco}<g class="wp" style="color:${t.a};fill:${t.a};filter:drop-shadow(0 0 10px ${t.a})"><svg x="14" y="26" width="192" height="86" viewBox="0 0 200 90"><use href="#w-${t.w}"/></svg></g></svg>`}

function render(){
 $('hdr').innerHTML=S?`<div class="gold"><span class="coin">G</span>${fmt(S.gold)}</div><button class="sm" onclick="topup()">+ Пополнить</button>`:'';
 renderCases();renderInv();renderUpgrade();renderCashback();renderWithdraw();renderProfile()}
function renderCases(){
 $('cases').innerHTML=CASES.map(c=>`<div class="case">${cover(c)}<div class="in"><h3>${esc(c.name)}</h3><small>${c.items.length} скинов, <a href="#" onclick="odds('${c.id}');return false" class="lnk">шансы</a></small>${c.free?`<button onclick="openCase('free')" ${freeLeft()?'disabled':''}>${freeLeft()?'Через '+leftTxt():'Открыть бесплатно'}</button>`:`<button onclick="openCase('${c.id}')"><span class="coin">G</span> ${fmt(c.price)}</button>`}</div></div>`).join('')}
function renderInv(){
 $('invSec').innerHTML=S?`<h2>Инвентарь</h2>${S.inv.length?`<div class="chips"><button class="ghost" onclick="sellAll()">Продать всё за ${fmt(S.inv.reduce((a,i)=>a+i.value,0))} G</button></div><div class="inv">${S.inv.map(i=>`<div class="it r${i.rarity}" style="--c:${RC[i.rarity]}">${wico(i.name)}<div>${esc(i.name)}<b>${RN[i.rarity]}</b></div><button class="ghost sm" onclick="sell(${i.id})">Продать ${fmt(i.value)} G</button></div>`).join('')}</div>`:'<p class="sub">Пока пусто. Открой первый кейс.</p>'}`:''}
function wpick(c){let r=Math.random()*c.items.reduce((a,i)=>a+i[3],0);for(const i of c.items){r-=i[3];if(r<0)return i}return c.items[0]}
function odds(id){const c=CASES.find(x=>x.id===id),t=c.items.reduce((a,i)=>a+i[3],0),rtp=c.price?c.items.reduce((a,i)=>a+i[3]*i[2],0)/t/c.price:0;
 modal(`<h2 style="margin-top:0">${esc(c.name)}: шансы</h2>${c.price?`<p class="sub">Средний возврат: ${(rtp*100).toFixed(1)}% от цены кейса, плюс кэшбэк ${(S&&S.cbPct)||5}%.</p>`:''}<div class="wrap"><table class="tbl"><tr><th>Скин</th><th>Цена</th><th>Шанс</th></tr>${c.items.slice().sort((a,b)=>b[2]-a[2]).map(i=>`<tr><td>${esc(i[0])}</td><td>${fmt(i[2])} G</td><td>${(i[3]/t*100).toFixed(2)}%</td></tr>`).join('')}</table></div>`)}

function confetti(cols,n){const c=$('fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*15,vy:-Math.random()*13-4,s:Math.random()*7+4,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));let f=0;
 (function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.35;p.r+=.2;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});if(++f<150)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}

const QE='<svg viewBox="0 0 100 100" width="92" height="92"><path d="M18 74C6 56 8 30 22 16M82 74c12-18 10-44-4-58" fill="none" stroke="#ffc400" stroke-width="4" stroke-linecap="round"/><circle cx="50" cy="50" r="38" fill="#ffc400" stroke="#fff3a0" stroke-width="3"/><circle cx="50" cy="50" r="30" fill="none" stroke="#a87a00" stroke-width="2"/><text x="50" y="66" text-anchor="middle" font-size="46" font-weight="700" fill="#4a3300" font-family="Chakra Petch,sans-serif">?</text></svg>';
function openCase(id){run(async()=>{
 const c=CASES.find(x=>x.id===id);
 if(!S)return auth();
 if(!c.free&&S.gold<c.price)return topup('Не хватает голды: нужно '+fmt(c.price)+' G.');
 const{win}=await api('open',{id});lastWin=win;
 const W=36,strip=[],w=[win.name,win.rarity,win.value];
 for(let i=0;i<46;i++)strip.push(i===W?w:wpick(c));
 modal(`<h2 style="margin-top:0">${esc(c.name)}</h2><div class="reel" id="reel"><div class="strip" id="strip">${strip.map(itemHtml).join('')}</div><div class="ptr"></div><div class="qm" id="qm">${QE}</div></div><div id="res" style="min-height:90px"></div>`);
 const reel=$('reel'),s=$('strip'),off=W*124+58-reel.clientWidth/2+(Math.random()*60-30);
 let done=false;
 const fin=()=>{if(done)return;done=true;s.children[W].classList.add('win');
  $('res').innerHTML=`<div class="res" style="--c:${RC[win.rarity]}">${wico(win.name)}<div class="rn">${RN[win.rarity]}</div><div class="rt">${esc(win.name)}</div><div class="rv">${fmt(win.value)} G</div><div class="row"><button onclick="closeM()">Забрать в инвентарь</button><button class="ghost" onclick="sellNow()">Продать за ${fmt(win.value)} G</button></div></div>`;
  if(win.rarity>=2){confetti([RC[win.rarity],'#ffffff','#ffd84a'],win.rarity>=3?150:70);hap('ok')}else hap('light')};
 if(still()){$('qm').classList.add('go');s.style.transform=`translateX(${-off}px)`;fin();return}
 await sleep(1000);if(!$('strip'))return;
 $('qm').classList.add('go');
 s.style.transition='none';s.style.transform='translateX(0)';
 await sleep(60);
 s.style.transition='transform 6.2s cubic-bezier(.08,.62,.1,1)';s.style.transform=`translateX(${-off}px)`;
 let last=-1;(function tick(){if(done||!$('strip'))return;const m=new DOMMatrix(getComputedStyle(s).transform),i=Math.floor((-m.m41+reel.clientWidth/2)/124);if(i!==last){last=i;hap('light')}requestAnimationFrame(tick)})();
 s.addEventListener('transitionend',fin,{once:true});setTimeout(fin,7000);
})}

function catalog(){const m=new Map();CASES.forEach(c=>c.items.forEach(i=>m.set(i[0],i)));return[...m.values()].sort((a,b)=>a[2]-b[2])}
const stakeV=()=>S?S.inv.filter(i=>UP.sel.includes(i.id)).reduce((a,i)=>a+i.value,0):0;
const chanceOf=(st,t)=>Math.min(.9,st/t[2]*.95);
function gauge(p){const R=84,C=2*Math.PI*R;
 return `<svg class="gauge" viewBox="0 0 200 200"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff7a00"/></linearGradient></defs><circle cx="100" cy="100" r="${R}" fill="none" stroke="#1b1b26" stroke-width="16"/><circle cx="100" cy="100" r="${R}" fill="none" stroke="url(#gg)" stroke-width="16" stroke-dasharray="${C*p} ${C}" transform="rotate(-90 100 100)"/><circle cx="100" cy="100" r="66" fill="rgba(255,255,255,.03)"/><g id="ptr" style="transform-origin:100px 100px"><polygon points="100,3 91,24 109,24" fill="#fff"/><rect x="98.5" y="20" width="3" height="14" fill="#fff"/></g><text id="gp" x="100" y="106" text-anchor="middle" class="gp">${(p*100).toFixed(2)}%</text><text id="gs" x="100" y="128" text-anchor="middle" class="gs">шанс успеха</text></svg>`}
function sumHtml(i,txt){return i?`<div class="pop" style="--c:${RC[i.rarity]}">${wico(i.name)}<div>${esc(i.name)}</div><b>${txt}</b></div>`:`<div style="color:var(--mut)">${txt}</div>`}
function renderUpgrade(){
 const el=$('t_upgrade');if(UP.busy)return;
 if(!S){el.innerHTML='<h2>Апгрейд</h2><p class="sub">Открой игру через Telegram.</p>';return}
 UP.sel=UP.sel.filter(id=>S.inv.some(i=>i.id===id));
 const st=stakeV();UPT=st?catalog().filter(t=>t[2]>st&&t[2]<=st*95):[];
 if(UP.t&&!UPT.some(t=>t[0]===UP.t))UP.t=null;
 const tg=UP.t&&UPT.find(t=>t[0]===UP.t),p=tg?chanceOf(st,tg):0;
 const top=S.inv.filter(i=>UP.sel.includes(i.id)).sort((a,b)=>b.value-a.value)[0];
 const tgi=tg?{name:tg[0],rarity:tg[1]}:null;
 el.innerHTML=`<h2>Апгрейд скинов</h2><p class="sub">Выбери свои скины, затем скин подороже. Чем он дороже, тем ниже шанс. Проигранные скины сгорают.</p>
 ${gauge(p)}
 <div class="up-row"><div class="card sumcard">${sumHtml(top,st?'Ставка '+fmt(st)+' G':'Выбери свои скины')}</div><div class="card sumcard">${sumHtml(tgi,tg?fmt(tg[2])+' G':'Выбери цель')}</div></div>
 <div class="chips">${['x2','x5','x10','p30','p50','p70'].map(k=>`<button class="ghost sm" onclick="upPreset('${k}')">${k[0]==='x'?k:k.slice(1)+'%'}</button>`).join('')}<button class="ghost sm" onclick="upPreset('rnd')">Случайно</button></div>
 <button class="big" id="upbtn" ${tg?'':'disabled'} onclick="doUpgrade()">${tg?'Улучшить, шанс '+(p*100).toFixed(2)+'%':'Улучшить'}</button>
 <div class="seg"><button class="${UP.view==='mine'?'on':''}" onclick="UP.view='mine';renderUpgrade()">Мои предметы</button><button class="${UP.view==='targets'?'on':''}" onclick="UP.view='targets';renderUpgrade()">Цели</button></div>
 ${UP.view==='mine'?(S.inv.length?`<div class="inv">${S.inv.map(i=>`<button class="it r${i.rarity} ${UP.sel.includes(i.id)?'pick':''}" style="--c:${RC[i.rarity]}" onclick="upPick(${i.id})">${wico(i.name)}<div>${esc(i.name)}<b>${fmt(i.value)} G</b></div></button>`).join('')}</div>`:'<p class="sub">Инвентарь пуст. Открой кейс.</p>'):(st?(UPT.length?`<div class="inv">${UPT.map((t,k)=>`<button class="it r${t[1]} ${UP.t===t[0]?'pick':''}" style="--c:${RC[t[1]]}" onclick="upTarget(${k})">${wico(t[0])}<div>${esc(t[0])}<b>${fmt(t[2])} G, шанс ${(chanceOf(st,t)*100).toFixed(1)}%</b></div></button>`).join('')}</div>`:'<p class="sub">Для такой ставки нет подходящих скинов.</p>'):'<p class="sub">Сначала выбери свои скины.</p>')}`}
function upPick(id){const k=UP.sel.indexOf(id);k<0?UP.sel.push(id):UP.sel.splice(k,1);renderUpgrade()}
function upTarget(k){UP.t=UPT[k][0];renderUpgrade()}
function upPreset(k){if(!UPT.length)return toast('Сначала выбери свои скины');const st=stakeV();let t;
 if(k==='rnd')t=UPT[Math.floor(Math.random()*UPT.length)];
 else{const want=k[0]==='x'?st*(+k.slice(1)):st*.95/(+k.slice(1)/100);t=UPT.reduce((a,b)=>Math.abs(b[2]-want)<Math.abs(a[2]-want)?b:a)}
 UP.t=t[0];renderUpgrade()}
function doUpgrade(){run(async()=>{
 const st=stakeV(),tg=UPT.find(t=>t[0]===UP.t);if(!tg)return;
 UP.busy=true;$('upbtn').disabled=true;document.querySelector('.gauge').scrollIntoView({behavior:'smooth',block:'center'});
 let r;try{r=await api('upgrade',{ids:UP.sel,target:UP.t})}catch(e){UP.busy=false;throw e}
 const ptr=$('ptr'),arc=360*r.chance,land=r.won?arc*(.07+Math.random()*.86):arc+(360-arc)*(.05+Math.random()*.9),fin=360*6+land;
 if(still())ptr.style.transform=`rotate(${land}deg)`;
 else{ptr.style.transition='transform 5.4s cubic-bezier(.12,.72,.08,1)';ptr.style.transform=`rotate(${fin}deg)`;
  const t0=Date.now();const iv=setInterval(()=>{if(Date.now()-t0>4600)clearInterval(iv);else hap('light')},260);await sleep(5600)}
 const gp=$('gp'),gs=$('gs');gp.textContent=r.won?'УСПЕХ':'НЕУДАЧА';gp.style.fill=r.won?'#46e08a':'#ff5d6c';gs.textContent=r.won?'Ты получил '+tg[0]:'Скины сгорели';
 if(r.won){confetti([RC[tg[1]],'#ffffff','#ffd84a'],140);hap('ok')}else hap('heavy');
 await sleep(1500);
 UP.sel=[];UP.t=null;UP.busy=false;
 modal(`<h2 style="margin-top:0">${r.won?'Апгрейд удался':'Апгрейд не удался'}</h2>${r.won?`<div class="res" style="--c:${RC[tg[1]]}">${wico(tg[0])}<div class="rt">${esc(tg[0])}</div><div class="rv">${fmt(tg[2])} G</div></div>`:`<p class="sub">Шанс был ${(r.chance*100).toFixed(1)}%. Скины сгорели.</p>`}<button style="margin-top:12px" onclick="closeM()">Ок</button>`)
})}

function wdReg(r){WD.region=r;document.querySelectorAll('#wd_reg button').forEach((b,i)=>b.classList.toggle('on',(i?'cis':'ru')===r))}
function wdPick(id){const k=WD.sel.indexOf(id);k<0?WD.sel.push(id):WD.sel.splice(k,1);wdUpdate()}
function wdAll(){WD.sel=WD.sel.length===S.inv.length?[]:S.inv.map(i=>i.id);wdUpdate()}
function wdSend(){run(async()=>{await api('withdraw',{region:WD.region,login:WD.login.trim(),ids:WD.sel});WD.sel=[];await refresh();toast('Заявка отправлена');setTab('profile')})}
// ---------- профиль ----------
const refLink=()=>(CFG.link||'')+'?startapp=ref_'+(S?S.tg:'');
function shareRef(){TG.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(refLink())+'&text='+encodeURIComponent('CsGoth: открывай кейсы и забирай скины'))}
function copyRef(){navigator.clipboard?navigator.clipboard.writeText(refLink()).then(()=>toast('Ссылка скопирована'),()=>toast(refLink())):toast(refLink())}
function showLegal(k){const L=LEGAL[k];modal(`<h2 style="margin-top:0">${esc(L.t)}</h2><div class="legal">${L.x.split('\n\n').map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('')}</div>`)}
const ic=n=>`<svg class="ic"><use href="#i-${n}"/></svg>`;
function renderProfile(){const el=$('t_profile');
 if(!S){el.innerHTML='<h2>Профиль</h2><p class="sub">Открой игру через Telegram.</p>';return}
 el.innerHTML=`<div class="card prof"><div class="av">${esc((S.name||'?').replace('@','').charAt(0).toUpperCase())}</div><div><div class="pn">${esc(S.name)}</div><div class="note">ID ${S.tg}</div></div><div class="gold"><span class="coin">G</span>${fmt(S.gold)}</div></div>
 <div class="card pad"><h3 style="margin-top:0">История выводов</h3><p class="sub">Заявки на вывод скинов на Steam.</p>${S.wd.length?S.wd.map(w=>`<div class="hist"><span>№${w.id} · ${fmt(w.rub)} ₽</span><span class="st-${w.status}">${WDS[w.status]||w.status}</span></div>`).join(''):`<div class="empty">Заявок на вывод пока нет. Создайте первую в разделе «Вывод».<br><button onclick="setTab('withdraw')">Перейти к выводу</button></div>`}</div>
 <div class="row2" onclick="TG.openTelegramLink('https://t.me/csgoth_manager')"><div class="ib">${ic('support')}</div>Поддержка</div>
 <div class="row2" onclick="showLegal('terms')"><div class="ib">${ic('doc')}</div>Условия</div>
 <div class="row2" onclick="showLegal('privacy')"><div class="ib">${ic('shield')}</div>Политика конфиденциальности</div>
 <div class="card pad"><h3 style="margin-top:0">Реферальная программа</h3><p class="sub">Друг получит +50 G, ты +100 G и 5% от его пополнений.</p><div class="stats"><div><b>${fmt(S.refEarn)}</b>Баланс, G</div><div><b>${S.refs}</b>Рефералы</div><div><b>${S.refActive}</b>Активные</div></div><div class="linkrow"><input readonly value="${esc(refLink())}" onclick="this.select()"><button class="sq" onclick="copyRef()" aria-label="Копировать">${ic('copy')}</button></div><button style="width:100%" onclick="shareRef()">Поделиться ссылкой</button></div>
 ${S.admin?adminHtml():''}`}
// ---------- админка ----------
function adminHtml(){
 const items=w=>{try{return JSON.parse(w.items).map(i=>esc(i.name)).join(', ')}catch(e){return ''}};
 return `<h2>Админ-панель</h2><p class="sub">Игроков: ${ADM.length}. Кейсов открыто: ${fmt(ADM.reduce((a,x)=>a+x.opened,0))}.</p>
 <h3>Заявки на вывод</h3><div class="wrap"><table class="tbl"><tr><th>№</th><th>Игрок</th><th>Steam</th><th>Регион</th><th>К выплате</th><th>Скины</th><th></th></tr>${ADMW.length?ADMW.map(w=>`<tr><td>${w.id}</td><td>${esc(w.display||'')} (${w.tg_id})</td><td>${esc(w.steam)}</td><td>${w.region==='cis'?'СНГ':'Россия'}</td><td>${fmt(w.rub)} ₽</td><td>${items(w)}</td><td>${w.status==='new'?`<button class="sm" onclick="wdAct(${w.id},'paid')">Выплачено</button> <button class="ghost sm" onclick="wdAct(${w.id},'reject')">Отклонить</button>`:`<span class="st-${w.status}">${WDS[w.status]}</span>`}</td></tr>`).join(''):'<tr><td colspan="7">Заявок нет</td></tr>'}</table></div>
 <h3>Игроки</h3><div class="wrap"><table class="tbl"><tr><th>Игрок</th><th>Голда</th><th>Открыто</th><th>Изменить баланс</th></tr>${ADM.map((x,i)=>`<tr><td>${esc(x.display||x.name)} (${x.tg_id||'-'})${x.admin?' (админ)':''}</td><td>${fmt(x.gold)}</td><td>${x.opened}</td><td><input type="number" id="ag_${i}" placeholder="±голда"> <button class="sm" onclick="adminGold(${i})">ОК</button></td></tr>`).join('')}</table></div>
 <h3>Промокоды и партнёры</h3><p class="sub">Бонус игроку добавляется к пополнению. Партнёру (блогеру, стримеру) его доля зачисляется голдой с первого пополнения игрока по его коду.</p><div class="wrap"><table class="tbl"><tr><th>Код</th><th>Бонус</th><th>Партнёр</th><th>Доля</th><th>Лимит</th><th>Использован</th><th>Пополнено</th><th>Выдано</th><th></th></tr>${ADMP.map(p=>`<tr><td>${esc(p.code)}</td><td>${p.bonus}%</td><td>${esc(p.partner||'-')}</td><td>${p.partner_pct}%</td><td>${p.max_uses||'без лимита'}</td><td>${p.uses}</td><td>${fmt(p.deposited)}</td><td>${fmt(p.paid)} G</td><td><button class="ghost sm" onclick="promoToggle('${esc(p.code)}')">${p.active?'Выключить':'Включить'}</button></td></tr>`).join('')}</table></div>
 <div class="chips"><input id="pc_code" placeholder="КОД" style="width:110px"><input id="pc_bonus" type="number" placeholder="бонус %" style="width:100px"><input id="pc_partner" placeholder="Telegram ID партнёра" style="width:170px"><input id="pc_pct" type="number" placeholder="доля партнёра %" style="width:150px"><input id="pc_max" type="number" placeholder="лимит, 0 = нет" style="width:130px"><button onclick="promoSave()">Сохранить код</button></div>
 <h3>Цены кейсов</h3><div class="wrap"><table class="tbl">${CASES.filter(c=>!c.free).map(c=>`<tr><td>${esc(c.name)}</td><td><input type="number" min="1" id="ap_${c.id}" value="${c.price}"></td><td><button class="sm" onclick="adminPrice('${c.id}')">Сохранить</button></td></tr>`).join('')}</table></div>`}
function adminGold(i){run(async()=>{const d=parseInt($('ag_'+i).value);if(!d)return;await api('admin/gold',{name:ADM[i].name,delta:d});await refresh();toast('Баланс изменён')})}
function adminPrice(id){run(async()=>{await api('admin/price',{id,price:parseInt($('ap_'+id).value)});await refresh();toast('Цена сохранена')})}
function promoSave(){run(async()=>{await api('admin/promo',{code:$('pc_code').value,bonus:$('pc_bonus').value,partner:$('pc_partner').value,partner_pct:$('pc_pct').value,max_uses:$('pc_max').value});await refresh();toast('Промокод сохранён')})}
function promoToggle(code){run(async()=>{await api('admin/promo/toggle',{code});await refresh()})}
function wdAct(id,action){run(async()=>{await api('admin/withdraw',{id,action});await refresh();toast(action==='paid'?'Отмечено как выплаченное':'Заявка отклонена, скины возвращены')})}
// ---------- пополнение ----------
function methods(){const m=[];if(CFG.stars)m.push('stars');if(CFG.pay)m.push('card');if(!m.length)m.push('demo');return m}
function topup(msg,pm){if(!S)return auth();
 const ms=methods();PM=pm&&ms.includes(pm)?pm:(PM&&ms.includes(PM)?PM:ms[0]);
 const names={stars:'Telegram Stars',card:'Карта или СБП',demo:'Тест без денег'},st=PM==='stars',chips=st?[50,100,250,500]:[100,500,1000,5000];
 modal(`<h2 style="margin-top:0">Пополнение</h2>${msg?'<p style="color:var(--y)">'+esc(msg)+'</p>':''}${ms.length>1?`<div class="seg">${ms.map(m=>`<button class="${m===PM?'on':''}" onclick="topup('','${m}')">${names[m]}</button>`).join('')}</div>`:''}<p class="sub">${st?'1 Star = '+(CFG.starGold||1)+' G':'Курс: 1 ₽ = 1 G'}. Проблемы с оплатой? Пиши в поддержку: <a href="https://t.me/csgoth_manager" target="_blank" rel="noopener">@csgoth_manager</a></p><div class="chips">${chips.map(a=>`<button class="ghost" onclick="$('amt').value=${a};showGold()">${fmt(a)} ${st?'★':'₽'}</button>`).join('')}</div><label>${st?'Количество Stars':'Сумма, ₽'}</label><input id="amt" type="number" min="${st?1:10}" value="${chips[1]}" oninput="showGold()"><p class="note" id="gld"></p><label>Промокод (необязательно)</label><input id="pr" onchange="checkPromo()"><p class="note" id="prm"></p><button class="big" onclick="pay()">Пополнить</button>`);showGold()}
function showGold(){const a=parseInt($('amt').value)||0;$('gld').textContent=a>0?'Получишь: '+fmt(PM==='stars'?Math.floor(a*(CFG.starGold||1)):a)+' G':''}
function pay(){run(async()=>{
 const a=parseInt($('amt').value),promo=$('pr').value.trim();
 if(PM==='stars'){if(!a||a<1)return toast('Минимум 1 Star');const r=await api('pay/stars',{stars:a,promo});
  TG.openInvoice(r.link,s=>{if(s==='paid'){closeM();toast('Оплата прошла, зачисляем голду');[1500,4000,8000].forEach(t=>setTimeout(refresh,t))}else if(s==='failed')toast('Платёж не прошёл')});return}
 if(!a||a<10)return toast('Минимум 10 ₽');
 if(PM==='card'){const r=await api('pay/create',{amount:a,promo});TG.openLink(r.url);closeM();return}
 await api('topup',{amount:a});closeM();toast('Зачислено '+fmt(a)+' G')})}
async function checkPromo(){const c=$('pr').value.trim();if(!c){$('prm').textContent='';return}try{const r=await api('promo/'+encodeURIComponent(c));$('prm').textContent='Бонус: +'+r.bonus+'% голды к пополнению'}catch(e){$('prm').textContent=e.message}}
// ---------- запуск ----------
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeM()});
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('a[href^="https://t.me/"]');if(a&&TG&&TG.initData){e.preventDefault();TG.openTelegramLink(a.href)}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TOKEN)api('pay/check',{}).catch(()=>{}).then(refresh)});
async function boot(){
 if(!TG||!TG.initData){$('nav').remove();document.querySelector('main').innerHTML='<h2>Открой игру в Telegram</h2><p class="sub">CsGoth работает как мини-приложение Telegram. Найди нашего бота и нажми «Играть».</p>';return}
 TG.ready();TG.expand();try{TG.setHeaderColor('#050505');TG.setBackgroundColor('#050505');TG.disableVerticalSwipes&&TG.disableVerticalSwipes()}catch(e){}
 try{CFG=await api('config')}catch(e){}
 try{await tgLogin()}catch(e){toast(e.message)}
 await refresh()}
boot();
</script>
</body>
</html>
